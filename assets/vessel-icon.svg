<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a5e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00cc6a"/>
    </linearGradient>
  </defs>

  <!-- Ship hull -->
  <path d="M 15 50 L 50 20 L 85 50 L 75 55 L 50 35 L 25 55 Z" fill="url(#hull)" stroke="#00ff88" stroke-width="1"/>

  <!-- Ship body -->
  <ellipse cx="50" cy="55" rx="30" ry="15" fill="url(#hull)" stroke="#00ff88" stroke-width="1"/>

  <!-- Bridge -->
  <rect x="42" y="45" width="16" height="10" rx="2" fill="#252540" stroke="#00ff88" stroke-width="1"/>

  <!-- Engine glow -->
  <ellipse cx="50" cy="70" rx="12" ry="5" fill="#00ff88" opacity="0.3"/>
  <ellipse cx="50" cy="70" rx="8" ry="3" fill="#00ff88" opacity="0.6"/>

  <!-- Side engines -->
  <rect x="22" y="52" width="8" height="12" rx="1" fill="#252540" stroke="#ff6b35" stroke-width="1"/>
  <rect x="70" y="52" width="8" height="12" rx="1" fill="#252540" stroke="#ff6b35" stroke-width="1"/>

  <!-- Engine flames -->
  <ellipse cx="26" cy="67" rx="4" ry="3" fill="#ff6b35" opacity="0.5"/>
  <ellipse cx="74" cy="67" rx="4" ry="3" fill="#ff6b35" opacity="0.5"/>

  <!-- Stars -->
  <circle cx="10" cy="15" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="25" cy="10" r="0.5" fill="#fff" opacity="0.5"/>
  <circle cx="75" cy="12" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="90" cy="20" r="0.5" fill="#fff" opacity="0.4"/>
  <circle cx="85" cy="80" r="0.5" fill="#fff" opacity="0.5"/>
  <circle cx="15" cy="85" r="1" fill="#fff" opacity="0.6"/>
</svg>
